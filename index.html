<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 스마트 포토 메모장</title>
    <!-- [안전화 적용] 보안 경고 및 차단 에러를 완벽히 우회하여 화면을 한 장의 사진으로 구워주는 공인 라이브러리 주소입니다 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* 기본 상태: 다크 모드 */
        :root {
            --bg-color: #1e1e1e;
            --text-color: #f5f5f5;
            --pad-bg: #2d2d2d;
            --border-color: #444;
        }
        /* 라이트 모드 */
        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #333333;
            --pad-bg: #f9f9f9;
            --border-color: #ccc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            transition: all 0.3s;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        /* 편집창 스타일 */
        .editor-wrapper {
            background-color: var(--bg-color);
            padding: 5px;
            border-radius: 8px;
        }
        #notepad {
            width: 100%;
            height: 65vh;
            background-color: var(--pad-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 15px;
            font-size: 18px;
            line-height: 1.6;
            box-sizing: border-box;
            border-radius: 8px;
            overflow-y: auto;
            word-break: break-all;
        }
        #notepad:focus {
            outline: 2px solid #4CAF50;
        }
        #notepad img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 12px 0;
            border-radius: 6px;
        }
        
        /* 안내 가이드 문구 */
        #notepad:empty:before {
            content: "여기에 내용을 입력하거나 사진을 추가하세요. 자동으로 저장됩니다...";
            color: #888;
            cursor: text;
        }

        .footer {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            display: flex;
            justify-content: space-between;
        }
        
        /* ---------------- 보내주신 이미지 피드백 규격 고정 ---------------- */
        button {
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #555;
            background: var(--pad-bg);
            color: var(--text-color);
            font-weight: bold;
            font-size: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            height: 55px;
            padding: 0;
            transition: background 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        
        /* 1. 정사각형 버튼 군 (테마가 맨 앞, 그 뒤로 +, - 순서 완벽 고정) */
        .btn-square {
            width: 55px;
        }

        /* 왼쪽 위 흰색, 오른쪽 아래 검은색 대각선 반반 고정 */
        #themeToggle {
            background: linear-gradient(135deg, #ffffff 50%, #111111 50%) !important;
            border: 1px solid #555;
        }
        
        /* 2. 가로 길이가 일치하는 기능 버튼 군 */
        .btn-action {
            width: 125px;
            font-size: 17px;
        }
        
        /* 기능별 포인트 컬러 */
        .btn-img { background-color: #2196F3; color: white; border: none; }
        .btn-download { background-color: #4CAF50; color: white; border: none; }
        
        #imageInput { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📝 Photo Memo</h2>
        <div class="controls">
            <!-- 요청하신 대로 정렬 순서를 명확하게 고정했습니다 -->
            <button id="themeToggle" class="btn-square" title="테마 전환"></button>
            <button id="fontIncrease" class="btn-square" title="글자 확대">+</button>
            <button id="fontDecrease" class="btn-square" title="글자 축소">-</button>
            
            <button id="imgBtn" class="btn-action btn-img" onclick="document.getElementById('imageInput').click()">이미지 첨부</button>
            <input type="file" id="imageInput" accept="image/*">
            
            <button id="downloadBtn" class="btn-action btn-download">저장하기</button>
        </div>
    </div>
    
    <div class="editor-wrapper">
        <div id="notepad" contenteditable="true"></div>
    </div>
    
    <div class="footer">
        <div>* 사진 클릭 후 키보드 Delete를 누르면 삭제됩니다.</div>
        <div><span id="charCount">0</span> 자</div>
    </div>
</div>

<script>
    var notepad = document.getElementById('notepad');
    var charCount = document.getElementById('charCount');
    var themeToggle = document.getElementById('themeToggle');
    var downloadBtn = document.getElementById('downloadBtn');
    var fontIncrease = document.getElementById('fontIncrease');
    var fontDecrease = document.getElementById('fontDecrease');
    var imageInput = document.getElementById('imageInput');

    var currentFontSize = 18;

    window.onload = function() {
        notepad.innerHTML = localStorage.getItem('savedPhotoMemo') || '';
        
        var savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);

        var savedFontSize = localStorage.getItem('notepadFontSize');
        if (savedFontSize) {
            currentFontSize = parseInt(savedFontSize);
        }
        notepad.style.fontSize = currentFontSize + 'px';
        
        updateCharCount();
        updateImgSize();
    };

    notepad.addEventListener('input', function() {
        localStorage.setItem('savedPhotoMemo', notepad.innerHTML);
        updateCharCount();
    });

    function updateCharCount() {
        charCount.innerText = notepad.innerText.replace(/\n/g, '').length;
    }

    function updateImgSize() {
        var imgs = notepad.getElementsByTagName('img');
        for (var i = 0; i < imgs.length; i++) {
            imgs[i].style.maxWidth = Math.min(100, (currentFontSize * 4)) + '%';
        }
    }

    themeToggle.addEventListener('click', function() {
        var currentTheme = document.body.getAttribute('data-theme') || 'dark';
        var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });

    fontIncrease.addEventListener('click', function() {
        if (currentFontSize < 60) {
            currentFontSize += 2;
            notepad.style.fontSize = currentFontSize + 'px';
            localStorage.setItem('notepadFontSize', currentFontSize);
            updateImgSize();
        }
    });

    fontDecrease.addEventListener('click', function() {
        if (currentFontSize > 12) {
            currentFontSize -= 2;
            notepad.style.fontSize = currentFontSize + 'px';
            localStorage.setItem('notepadFontSize', currentFontSize);
            updateImgSize();
        }
    });

    imageInput.addEventListener('change', function(e) {
        if (!e.target.files || e.target.files.length === 0) return;
        var file = e.target.files[0];

        var reader = new FileReader();
        reader.onload = function(event) {
            var newImg = document.createElement('img');
            newImg.src = event.target.result;
            
            notepad.focus();
            notepad.appendChild(newImg);
            notepad.appendChild(document.createElement('br'));
            
            localStorage.setItem('savedPhotoMemo', notepad.innerHTML);
            updateCharCount();
            updateImgSize();
        };
        reader.readAsDataURL(file);
        imageInput.value = ''; 
    });

    // 💾 [대보완] 글과 사진을 통째로 엮어서 하나의 선명한 대형 이미지 파일(.jpg)로 다운로드하는 최종 완성형 시스템
    downloadBtn.addEventListener('click', function() {
        if (!notepad.innerText.trim() && notepad.getElementsByTagName('img').length === 0) {
            alert('내용이 없습니다!');
            return;
        }

        if (typeof html2canvas === 'undefined') {
            alert('인쇄 모듈 로딩 중입니다. 1초만 기다린 후 다시 눌러주세요!');
            return;
        }

        // 현재 테마 색상을 실시간으로 읽어와서 사진첩 내부 배경을 예쁘게 통일시킵니다
        var currentTheme = document.body.getAttribute('data-theme');
        var bgPattern = currentTheme === 'light' ? '#ffffff' : '#2d2d2d';

        // 메모 입력창 박스 자체를 그대로 사진으로 정밀 인쇄합니다
        html2canvas(notepad, {
            backgroundColor: bgPattern,
            useCORS: true,
            scale: 2 // 스마트폰 화면에서도 글자와 하트 사진이 흐릿하지 않고 선명하게 보이도록 화질 2배 강화
        }).then(function(canvas) {
            canvas.toBlob(function(blob) {
                var now = new Date();
                var timestamp = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0') + '_' + String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');
                
                // 최종 .jpg 이미지 추출 다운로드 발송
                var link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'my_photo_memo_' + timestamp + '.jpg';
                link.click();
                URL.revokeObjectURL(link.href);
            }, 'image/jpeg', 0.95);
        }).catch(function(err) {
            alert("이미지 변환 중 오류가 발생했습니다.");
        });
    });
</script>

</body>
</html>
