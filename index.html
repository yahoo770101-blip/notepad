<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 스마트 포토 메모장</title>
    <!-- 화면을 이미지로 변환해주는 라이브러리 -->
    <script src="https://cloudflare.com"></script>
    <style>
        /* 기본 상태: 다크 모드 */
        :root {
            --bg-color: #1e1e1e;
            --text-color: #f5f5f5;
            --pad-bg: #2d2d2d;
            --border-color: #444;
        }
        /* 라이트 모드 */
        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #333333;
            --pad-bg: #f9f9f9;
            --border-color: #ccc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            transition: all 0.3s;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        /* 편집창 스타일 */
        .editor-wrapper {
            background-color: var(--bg-color);
            padding: 5px;
            border-radius: 8px;
        }
        #notepad {
            width: 100%;
            height: 65vh;
            background-color: var(--pad-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 15px;
            font-size: 18px;
            line-height: 1.6;
            box-sizing: border-box;
            border-radius: 8px;
            overflow-y: auto;
            word-break: break-all;
        }
        #notepad:focus {
            outline: 2px solid #4CAF50;
        }
        #notepad img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 12px 0;
            border-radius: 6px;
        }
        #notepad:empty:before {
            content: attr(placeholder);
            color: #888;
        }

        .footer {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            display: flex;
            justify-content: space-between;
        }
        
        /* ---------------- 버튼 디자인 가이드 라인 ---------------- */
        button {
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #555;
            background: var(--pad-bg);
            color: var(--text-color);
            font-weight: bold;
            font-size: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            height: 55px;
            padding: 0;
            transition: background 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        
        /* 1. 정사각형 버튼 3종 (+, -, 테마) */
        .btn-square {
            width: 55px;
        }

        /* [요청 사항 완료] 대각선 방향을 왼쪽위(흰색)에서 오른쪽아래(검은색)로 전환 배치 완료 */
        #themeToggle {
            background: linear-gradient(135deg, #ffffff 50%, #111111 50%) !important;
            border: 1px solid #555;
        }
        
        /* 2. 일반 기능 버튼 3종 가로 크기 125px 일치화 */
        .btn-action {
            width: 125px;
            font-size: 17px;
        }
        
        /* 기능별 포인트 색상 배치 */
        .btn-img { background-color: #2196F3; color: white; border: none; }
        .btn-share { background-color: #FF9800; color: white; border: none; }
        .btn-download { background-color: #4CAF50; color: white; border: none; }
        
        #imageInput { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📝 Photo Memo</h2>
        <div class="controls">
            <button id="fontIncrease" class="btn-square" title="글자 확대">+</button>
            <button id="fontDecrease" class="btn-square" title="글자 축소">-</button>
            <button id="themeToggle" class="btn-square" title="테마 전환"></button>
            
            <button id="imgBtn" class="btn-action btn-img" onclick="document.getElementById('imageInput').click()">이미지 첨부</button>
            <input type="file" id="imageInput" accept="image/*">
            
            <button id="shareBtn" class="btn-action btn-share">공유하기</button>
            <button id="downloadBtn" class="btn-action btn-download">저장하기</button>
        </div>
    </div>
    
    <div class="editor-wrapper">
        <!-- 빈 박스 처리 버그를 방지하기 위해 가상 div 자리를 완전 삭제하고 초기 공백을 배치합니다 -->
        <div id="notepad" contenteditable="true" placeholder="여기에 내용을 입력하거나 사진을 추가하세요. 자동으로 저장됩니다..."></div>
    </div>
    
    <div class="footer">
        <div>* 사진 클릭 후 키보드 Delete를 누르면 삭제됩니다.</div>
        <div><span id="charCount">0</span> 자</div>
    </div>
</div>

<script>
    const notepad = document.getElementById('notepad');
    const charCount = document.getElementById('charCount');
    const themeToggle = document.getElementById('themeToggle');
    const downloadBtn = document.getElementById('downloadBtn');
    const shareBtn = document.getElementById('shareBtn');
    const fontIncrease = document.getElementById('fontIncrease');
    const fontDecrease = document.getElementById('fontDecrease');
    const imageInput = document.getElementById('imageInput');

    let currentFontSize = 18;

    window.onload = () => {
        // 로컬 환경 브라우저 데이터베이스 입출력 에러 방어 처리
        try {
            notepad.innerHTML = localStorage.getItem('savedPhotoMemo') || '';
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
            
            const savedFontSize = localStorage.getItem('notepadFontSize');
            if (savedFontSize) {
                currentFontSize = parseInt(savedFontSize);
            }
        } catch(e) {}
        
        notepad.style.fontSize = currentFontSize + 'px';
        updateCharCount();
        updateImgSize();
    };

    notepad.addEventListener('input', () => {
        try {
            localStorage.setItem('savedPhotoMemo', notepad.innerHTML);
        } catch(e) {}
        updateCharCount();
    });

    function updateCharCount() {
        charCount.innerText = notepad.innerText.replace(/\n/g, '').length;
    }

    function updateImgSize() {
        const imgs = notepad.getElementsByTagName('img');
        for(let img of imgs) {
            img.style.maxWidth = Math.min(100, (currentFontSize * 4)) + '%';
        }
    }

    // 테마 토글 연동 정상화
    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme') || 'dark';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        try {
            localStorage.setItem('theme', newTheme);
        } catch(e) {}
    });

    fontIncrease.addEventListener('click', () => {
        if (currentFontSize < 60) {
            currentFontSize += 2;
            notepad.style.fontSize = currentFontSize + 'px';
            try { localStorage.setItem('notepadFontSize', currentFontSize); } catch(e) {}
            updateImgSize();
        }
    });

    fontDecrease.addEventListener('click', () => {
        if (currentFontSize > 12) {
            currentFontSize -= 2;
            notepad.style.fontSize = currentFontSize + 'px';
            try { localStorage.setItem('notepadFontSize', currentFontSize); } catch(e) {}
            updateImgSize();
        }
    });

    // 🖼️ 이미지 첨부 기능 전면 보완 (로컬 컴퓨터 내 파일 업로드 완벽 작동)
    imageInput.addEventListener('change', function(e) {
        if (!e.target.files || e.target.files.length === 0) return;
        const file = e.target.files[0];

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 600;
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }
                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const compressedUrl = canvas.toDataURL('image/jpeg', 0.7); 
                const newImg = document.createElement('img');
                newImg.src = compressedUrl;
                
                notepad.focus();
                
                // 로컬 브라우저에서 인쇄 커서 위치 판별 실패 시 맨 뒤 안착 보장 기술 적용
                const selection = window.getSelection();
                let inserted = false;
                
                if (selection && selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    if (notepad.contains(range.commonAncestorContainer)) {
                        range.insertNode(newImg);
                        range.insertNode(document.createElement('br'));
                        inserted = true;
                    }
                }
                
                if (!inserted) {
                    notepad.appendChild(newImg);
                    notepad.appendChild(document.createElement('br'));
                }
                
                try { localStorage.setItem('savedPhotoMemo', notepad.innerHTML); } catch(e) {}
                updateCharCount();
                updateImgSize();
            };
            img.src = event.target.result;
        };
