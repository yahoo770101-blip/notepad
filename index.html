<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 스마트 포토 메모장</title>
    <style>
        /* 기본 상태: 다크 모드 */
        :root {
            --bg-color: #1e1e1e;
            --text-color: #f5f5f5;
            --pad-bg: #2d2d2d;
            --border-color: #444;
        }
        /* 라이트 모드 */
        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #333333;
            --pad-bg: #f9f9f9;
            --border-color: #ccc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            transition: all 0.3s;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        /* 편집창 스타일 */
        .editor-wrapper {
            background-color: var(--bg-color);
            padding: 5px;
            border-radius: 8px;
        }
        #notepad {
            width: 100%;
            height: 65vh;
            background-color: var(--pad-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 15px;
            font-size: 18px;
            line-height: 1.6;
            box-sizing: border-box;
            border-radius: 8px;
            overflow-y: auto;
            word-break: break-all;
        }
        #notepad:focus {
            outline: 2px solid #4CAF50;
        }
        #notepad img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 12px 0;
            border-radius: 6px;
        }
        
        /* 안내 문구 가이드 */
        #notepad:empty:before {
            content: "여기에 내용을 입력하거나 사진을 추가하세요. 자동으로 저장됩니다...";
            color: #888;
            cursor: text;
        }

        .footer {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            display: flex;
            justify-content: space-between;
        }
        
        /* ---------------- 버튼 디자인 설정 ---------------- */
        button {
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #555;
            background: var(--pad-bg);
            color: var(--text-color);
            font-weight: bold;
            font-size: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            height: 55px;
            padding: 0;
            transition: background 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        
        /* 1. 정사각형 버튼 군 (테마가 맨 앞, 그 다음 +, -) */
        .btn-square {
            width: 55px;
        }

        /* 왼쪽 위 흰색, 오른쪽 아래 검은색 대각선 반반 고정 */
        #themeToggle {
            background: linear-gradient(135deg, #ffffff 50%, #111111 50%) !important;
            border: 1px solid #555;
        }
        
        /* 2. 가로 길이가 일치하는 기능 버튼 군 */
        .btn-action {
            width: 125px;
            font-size: 17px;
        }
        
        /* 기능별 포인트 컬러 */
        .btn-img { background-color: #2196F3; color: white; border: none; }
        .btn-download { background-color: #4CAF50; color: white; border: none; }
        
        #imageInput { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📝 Photo Memo</h2>
        <div class="controls">
            <!-- 요청하신 대로 테마가 맨 앞, 그 뒤로 +, - 정렬 순서 유지 -->
            <button id="themeToggle" class="btn-square" title="테마 전환"></button>
            <button id="fontIncrease" class="btn-square" title="글자 확대">+</button>
            <button id="fontDecrease" class="btn-square" title="글자 축소">-</button>
            
            <button id="imgBtn" class="btn-action btn-img" onclick="document.getElementById('imageInput').click()">이미지 첨부</button>
            <input type="file" id="imageInput" accept="image/*">
            
            <button id="downloadBtn" class="btn-action btn-download">저장하기</button>
        </div>
    </div>
    
    <div class="editor-wrapper">
        <div id="notepad" contenteditable="true"></div>
    </div>
    
    <div class="footer">
        <div>* 사진 클릭 후 키보드 Delete를 누르면 삭제됩니다.</div>
        <div><span id="charCount">0</span> 자</div>
    </div>
</div>

<script>
    const notepad = document.getElementById('notepad');
    const charCount = document.getElementById('charCount');
    const themeToggle = document.getElementById('themeToggle');
    const downloadBtn = document.getElementById('downloadBtn');
    const fontIncrease = document.getElementById('fontIncrease');
    const fontDecrease = document.getElementById('fontDecrease');
    const imageInput = document.getElementById('imageInput');

    let currentFontSize = 18;

    function safeGet(key, defaultVal) {
        try { return localStorage.getItem(key) || defaultVal; } catch(e) { return defaultVal; }
    }
    function safeSet(key, val) {
        try { localStorage.setItem(key, val); } catch(e) {}
    }

    window.onload = () => {
        notepad.innerHTML = safeGet('savedPhotoMemo', '');
        
        const savedTheme = safeGet('theme', 'dark');
        document.body.setAttribute('data-theme', savedTheme);

        const savedFontSize = safeGet('notepadFontSize', '18');
        currentFontSize = parseInt(savedFontSize);
        notepad.style.fontSize = currentFontSize + 'px';
        
        updateCharCount();
        updateImgSize();
    };

    notepad.addEventListener('input', () => {
        safeSet('savedPhotoMemo', notepad.innerHTML);
        updateCharCount();
    });

    function updateCharCount() {
        charCount.innerText = notepad.innerText.replace(/\n/g, '').length;
    }

    function updateImgSize() {
        const imgs = notepad.getElementsByTagName('img');
        for(let img of imgs) {
            img.style.maxWidth = Math.min(100, (currentFontSize * 4)) + '%';
        }
    }

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme') || 'dark';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        safeSet('theme', newTheme);
    });

    fontIncrease.addEventListener('click', () => {
        if (currentFontSize < 60) {
            currentFontSize += 2;
            notepad.style.fontSize = currentFontSize + 'px';
            safeSet('notepadFontSize', currentFontSize);
            updateImgSize();
        }
    });

    fontDecrease.addEventListener('click', () => {
        if (currentFontSize > 12) {
            currentFontSize -= 2;
            notepad.style.fontSize = currentFontSize + 'px';
            safeSet('notepadFontSize', currentFontSize);
            updateImgSize();
        }
    });

    imageInput.addEventListener('change', function(e) {
        if (!e.target.files || e.target.files.length === 0) return;
        const file = e.target.files[0];

        const reader = new FileReader();
        reader.onload = function(event) {
            const newImg = document.createElement('img');
            newImg.src = event.target.result;
            
            notepad.focus();
            notepad.appendChild(newImg);
            notepad.appendChild(document.createElement('br'));
            
            safeSet('savedPhotoMemo', notepad.innerHTML);
            updateCharCount();
            updateImgSize();
        };
        reader.readAsDataURL(file);
        imageInput.value = ''; 
    });

    downloadBtn.addEventListener('click', () => {
        const textLines = notepad.innerText.split('\n');
        const imgs = notepad.getElementsByTagName('img');
        
        if (!notepad.innerText.trim() && imgs.length === 0) {
            alert('내용이 없습니다!');
            return;
        }

        // 가상 캔버스를 생성해 글과 이미지를 차례대로 안전하게 도화지에 그려줍니다
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        const width = Math.max(600, notepad.offsetWidth);
        let height = 40; // 여백 확보
        
        // 전체 높이 미리 계산
        height += textLines.length * (currentFontSize * 1.6);
        if (imgs.length > 0) height += imgs.length * 320;

        canvas.width = width;
        canvas.height = height;

        // 배경색 칠하기
        const currentTheme = document.body.getAttribute('data-theme');
        ctx.fillStyle = currentTheme === 'light' ? '#ffffff' : '#2d2d2d';
        ctx.fillRect(0, 0, width, height);

        // 글꼴 스타일 지정
        ctx.font = `${currentFontSize}px sans-serif`;
        ctx.fillStyle = currentTheme === 'light' ? '#333333' : '#f5f5f5';
        ctx.textBaseline = 'top';

        let currentY = 20;

        // 1단계: 텍스트 줄바꿈 순차 렌더링
        textLines.forEach(line => {
            if (line.trim() !== "") {
                ctx.fillText(line, 20, currentY);
                currentY += currentFontSize * 1.6;
            }
        });

        currentY += 15;

        // 2단계: 이미지 객체 순차 그리기 기법 연동

            saveCanvas();
        } else {
            for (let i = 0; i < imgs.length; i++) {
                const imgObj = new Image();
                imgObj.src = imgs[i].src;
                imgObj.onload = function() {
