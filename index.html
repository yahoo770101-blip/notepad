<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 스마트 포토 메모장</title>
    <style>
        /* 테마 삭제 및 시크한 딥 블랙 스타일 완전 고정 */
        :root {
            --bg-color: #121212; 
            --text-color: #ffffff; 
            --pad-bg: #1e1e1e; 
            --border-color: #333333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .editor-wrapper {
            background-color: var(--bg-color);
            padding: 5px;
            border-radius: 8px;
        }
        /* 입력창 스타일 */
        #notepad {
            width: 100%;
            height: 65vh;
            background-color: var(--pad-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            font-size: 20px; /* 기본 20px 큰 글씨로 시작 */
            line-height: 1.7;
            box-sizing: border-box;
            border-radius: 8px;
            overflow-y: auto;
            word-break: break-all;
        }
        #notepad:focus {
            outline: 2px solid #2196F3;
        }
        #notepad img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 15px 0;
            border-radius: 6px;
        }
        
        /* 안내 가이드 문구 */
        #notepad:empty:before {
            content: "여기에 내용을 입력하거나 사진을 추가하세요. 자동으로 저장됩니다...";
            color: #666;
            cursor: text;
        }

        .footer {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
        
        /* ---------------- 버튼 디자인 가이드 ---------------- */
        button {
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #444;
            background: var(--pad-bg);
            color: var(--text-color);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            height: 55px;
            transition: background 0.2s;
        }
        button:hover {
            background: #2a2a2a;
        }
        
        /* 요청하신 대로 +, - 버튼 크기를 36픽셀(px)로 아주 큼직하게 유지했습니다 */
        .btn-square {
            width: 55px;
            font-size: 36px; 
            padding-bottom: 4px; 
        }
        
        /* 일반 기능 버튼 세팅 */
        .btn-action {
            width: 130px;
            font-size: 18px;
        }
        
        .btn-img { background-color: #2196F3; color: white; border: none; }
        .btn-download { background-color: #4CAF50; color: white; border: none; }
        
        #imageInput { display: none; }

        /* ---------------- [핵심 세팅] 인쇄/저장 시에만 발동하는 특수 규칙 ---------------- */
        @media print {
            /* 저장 버튼이나 상단 메뉴, 풋터 등 불필요한 것들은 싹 가려줍니다 */
            .header, .footer, #imgBtn, #fontIncrease, #fontDecrease, #downloadBtn {
                display: none !important;
            }
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
            }
            .container {
                max-width: 100% !important;
                width: 100% !important;
            }
            /* [버그 완전 해결] 스크롤 박스를 없애고 아래 적힌 긴 글 끝까지 통째로 펼쳐서 인쇄지에 찍어냅니다 */
            #notepad {
                height: auto !important;
                overflow: visible !important;
                border: none !important;
                background-color: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
            }
            #notepad img {
                max-width: 100% !important;
                page-break-inside: avoid; /* 사진 중간이 뚝 끊기는 현상 방지 */
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📝 Photo Memo</h2>
        <div class="controls">
            <button id="fontIncrease" class="btn-square" title="글자 확대">+</button>
            <button id="fontDecrease" class="btn-square" title="글자 축소">-</button>
            
            <button id="imgBtn" class="btn-action btn-img" onclick="document.getElementById('imageInput').click()">이미지 첨부</button>
            <input type="file" id="imageInput" accept="image/*">
            
            <button id="downloadBtn" class="btn-action btn-download">저장하기</button>
        </div>
    </div>
    
    <div class="editor-wrapper">
        <div id="notepad" contenteditable="true"></div>
    </div>
    
    <div class="footer">
        <div>* 사진 클릭 후 키보드 Delete를 누르면 삭제됩니다.</div>
        <div><span id="charCount">0</span> 자</div>
    </div>
</div>

<script>
    var notepad = document.getElementById('notepad');
    var charCount = document.getElementById('charCount');
    var downloadBtn = document.getElementById('downloadBtn');
    var fontIncrease = document.getElementById('fontIncrease');
    var fontDecrease = document.getElementById('fontDecrease');
    var imageInput = document.getElementById('imageInput');

    var currentFontSize = 20; 

    window.onload = function() {
        notepad.innerHTML = localStorage.getItem('savedPhotoMemo') || '';
        
        var savedFontSize = localStorage.getItem('notepadFontSize');
        if (savedFontSize) {
            currentFontSize = parseInt(savedFontSize);
        }
        notepad.style.fontSize = currentFontSize + 'px';
        
        updateCharCount();
        updateImgSize();
    };

    notepad.addEventListener('input', function() {
        localStorage.setItem('savedPhotoMemo', notepad.innerHTML);
        updateCharCount();
    });

    function updateCharCount() {
        charCount.innerText = notepad.innerText.replace(/\n/g, '').length;
    }

    function updateImgSize() {
        var imgs = notepad.getElementsByTagName('img');
        for (var i = 0; i < imgs.length; i++) {
            imgs[i].style.maxWidth = Math.min(100, (currentFontSize * 4)) + '%';
        }
    }

    fontIncrease.addEventListener('click', function() {
        if (currentFontSize < 60) {
            currentFontSize += 2;
            notepad.style.fontSize = currentFontSize + 'px';
            localStorage.setItem('notepadFontSize', currentFontSize);
            updateImgSize();
        }
    });

    fontDecrease.addEventListener('click', function() {
        if (currentFontSize > 12) {
            currentFontSize -= 2;
            notepad.style.fontSize = currentFontSize + 'px';
            localStorage.setItem('notepadFontSize', currentFontSize);
            updateImgSize();
        }
    });

    imageInput.addEventListener('change', function(e) {
        if (!e.target.files || e.target.files.length === 0) return;
        var file = e.target.files;

        var reader = new FileReader();
        reader.onload = function(event) {
            var newImg = document.createElement('img');
            newImg.src = event.target.result;
            
            notepad.focus();
            notepad.appendChild(newImg);
            notepad.appendChild(document.createElement('br'));
            
            localStorage.setItem('savedPhotoMemo', notepad.innerHTML);
            updateCharCount();
            updateImgSize();
        };
        reader.readAsDataURL(file);
        imageInput.value = ''; 
    });

    // 💾 [초고속 버그 타파] 브라우저 내장 기능을 호출하여 렉 없이 0.1초 만에 전체 내용을 저장창으로 넘깁니다.
    downloadBtn.addEventListener('click', function() {
        if (!notepad.innerText.trim() && notepad.getElementsByTagName('img').length === 0) {
            alert('내용이 없습니다!');
            return;
        }
        
        // 렉을 유발하던 모든 수식을 지우고 순수 브라우저 인쇄/내보내기 창을 즉시 호출합니다.
        window.print();
    });
</script>

</body>
</html>
