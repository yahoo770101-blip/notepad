<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 스마트 포토 메모장</title>
    <!-- [긴급 수리] 전 세계 브라우저에서 100% 안전하게 차단 없이 불러오는 공식 공인 검증 주소로 변경했습니다 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* 테마 삭제 및 시크한 딥 블랙 스타일 완전 고정 */
        :root {
            --bg-color: #121212; 
            --text-color: #ffffff; 
            --pad-bg: #1e1e1e; 
            --border-color: #333333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .editor-wrapper {
            background-color: var(--bg-color);
            padding: 5px;
            border-radius: 8px;
        }
        /* 입력창 스타일 */
        #notepad {
            width: 100%;
            height: 65vh;
            background-color: var(--pad-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            font-size: 20px; /* 요청하신 대로 20px로 글씨가 시원하게 시작됩니다 */
            line-height: 1.7;
            box-sizing: border-box;
            border-radius: 8px;
            overflow-y: auto;
            word-break: break-all;
        }
        #notepad:focus {
            outline: 2px solid #2196F3;
        }
        #notepad img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 15px 0;
            border-radius: 6px;
        }
        
        /* 안내 가이드 문구 */
        #notepad:empty:before {
            content: "여기에 내용을 입력하거나 사진을 추가하세요. 자동으로 저장됩니다...";
            color: #666;
            cursor: text;
        }

        .footer {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
        
        /* ---------------- 버튼 디자인 가이드 ---------------- */
        button {
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #444;
            background: var(--pad-bg);
            color: var(--text-color);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            height: 55px;
            transition: background 0.2s;
        }
        button:hover {
            background: #2a2a2a;
        }
        
        /* 요청하신 대로 +, - 버튼 크기를 36픽셀(px)로 큼직하게 설정 완료했습니다 */
        .btn-square {
            width: 55px;
            font-size: 36px; 
            padding-bottom: 4px; 
        }
        
        /* 일반 기능 버튼 세팅 */
        .btn-action {
            width: 130px;
            font-size: 18px;
        }
        
        /* 포인트 컬러스케일 */
        .btn-img { background-color: #2196F3; color: white; border: none; }
        .btn-download { background-color: #4CAF50; color: white; border: none; }
        
        #imageInput { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📝 Photo Memo</h2>
        <div class="controls">
            <button id="fontIncrease" class="btn-square" title="글자 확대">+</button>
            <button id="fontDecrease" class="btn-square" title="글자 축소">-</button>
            
            <button id="imgBtn" class="btn-action btn-img" onclick="document.getElementById('imageInput').click()">이미지 첨부</button>
            <input type="file" id="imageInput" accept="image/*">
            
            <button id="downloadBtn" class="btn-action btn-download">저장하기</button>
        </div>
    </div>
    
    <div class="editor-wrapper">
        <div id="notepad" contenteditable="true"></div>
    </div>
    
    <div class="footer">
        <div>* 사진 클릭 후 키보드 Delete를 누르면 삭제됩니다.</div>
        <div><span id="charCount">0</span> 자</div>
    </div>
</div>

<script>
    var notepad = document.getElementById('notepad');
    var charCount = document.getElementById('charCount');
    var downloadBtn = document.getElementById('downloadBtn');
    var fontIncrease = document.getElementById('fontIncrease');
    var fontDecrease = document.getElementById('fontDecrease');
    var imageInput = document.getElementById('imageInput');

    var currentFontSize = 20; 

    window.onload = function() {
        notepad.innerHTML = localStorage.getItem('savedPhotoMemo') || '';
        
        var savedFontSize = localStorage.getItem('notepadFontSize');
        if (savedFontSize) {
            currentFontSize = parseInt(savedFontSize);
        }
        notepad.style.fontSize = currentFontSize + 'px';
        
        updateCharCount();
        updateImgSize();
    };

    notepad.addEventListener('input', function() {
        localStorage.setItem('savedPhotoMemo', notepad.innerHTML);
        updateCharCount();
    });

    function updateCharCount() {
        charCount.innerText = notepad.innerText.replace(/\n/g, '').length;
    }

    function updateImgSize() {
        var imgs = notepad.getElementsByTagName('img');
        for (var i = 0; i < imgs.length; i++) {
            imgs[i].style.maxWidth = Math.min(100, (currentFontSize * 4)) + '%';
        }
    }

    fontIncrease.addEventListener('click', function() {
        if (currentFontSize < 60) {
            currentFontSize += 2;
            notepad.style.fontSize = currentFontSize + 'px';
            localStorage.setItem('notepadFontSize', currentFontSize);
            updateImgSize();
        }
    });

    fontDecrease.addEventListener('click', function() {
        if (currentFontSize > 12) {
            currentFontSize -= 2;
            notepad.style.fontSize = currentFontSize + 'px';
            localStorage.setItem('notepadFontSize', currentFontSize);
            updateImgSize();
        }
    });

    imageInput.addEventListener('change', function(e) {
        if (!e.target.files || e.target.files.length === 0) return;
        var file = e.target.files;

        var reader = new FileReader();
        reader.onload = function(event) {
            var newImg = document.createElement('img');
            newImg.src = event.target.result;
            
            notepad.focus();
            notepad.appendChild(newImg);
            notepad.appendChild(document.createElement('br'));
            
            localStorage.setItem('savedPhotoMemo', notepad.innerHTML);
            updateCharCount();
            updateImgSize();
        };
        reader.readAsDataURL(file);
        imageInput.value = ''; 
    });

    // 💾 [2% 아쉬움 완벽 해결] 글이 길어져서 스크롤이 생겨도 맨 아래 글끝까지 완벽하게 추적해 찍어내는 캡처 모듈
    downloadBtn.addEventListener('click', function() {
        if (!notepad.innerText.trim() && notepad.getElementsByTagName('img').length === 0) {
            alert('내용이 없습니다!');
            return;
        }

        if (typeof html2canvas === 'undefined') {
            alert('모듈을 매끄럽게 연결 중입니다. 1초만 기다린 후 다시 눌러주세요!');
            return;
        }

        // 스크롤 내부의 실제 총 높이를 정확하게 추출하여 통째로 굽는 세팅 고정
        var totalHeight = notepad.scrollHeight;

        html2canvas(notepad, {
            backgroundColor: '#1e1e1e', 
            useCORS: true,
            scale: 2, 
            height: totalHeight, // 보이는 화면 창 크기가 아닌, 텍스트가 적힌 맨 밑바닥 끝까지 높이를 지정합니다
            windowHeight: totalHeight,
            scrollY: -window.scrollY
        }).then(function(canvas) {
            canvas.toBlob(function(blob) {
                var now = new Date();
                var timestamp = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0') + '_' + String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');
                
                var link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'my_complete_memo_' + timestamp + '.jpg';
                link.click();
                URL.revokeObjectURL(link.href);
            }, 'image/jpeg', 0.95);
        }).catch(function(err) {
            alert("이미지 변환 중 오류가 발생했습니다.");
        });
    });
</script>

</body>
</html>
