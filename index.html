<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IM NotePad</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --pad-bg: #1e1e1e;
            --border-color: #333333;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .editor-wrapper {
            background-color: var(--bg-color);
            padding: 5px;
            border-radius: 8px;
        }

        #notepad {
            width: 100%;
            height: 65vh;
            background-color: var(--pad-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            font-size: 20px;
            line-height: 1.7;
            border-radius: 8px;
            overflow-y: auto;
            word-break: break-word;
            white-space: pre-wrap;
            outline: none;
        }

        #notepad:focus {
            outline: 2px solid #2196F3;
        }

        /* placeholder */
        #notepad.is-empty:before {
            content: "여기를 클릭하고, 메모하세요.";
            color: #666;
            cursor: text;
            pointer-events: none;
        }

        .footer {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #444;
            background: var(--pad-bg);
            color: var(--text-color);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 55px;
            padding: 0 12px;
            transition: background 0.15s, transform 0.05s;
            user-select: none;
        }
        button:hover { background: #2a2a2a; }
        button:active { transform: scale(0.97); }

        .btn-square {
            width: 55px;
            font-size: 32px;
            line-height: 1;
        }

        .btn-action {
            min-width: 120px;
            font-size: 16px;
        }

        .btn-clear { background-color: #b71c1c; color: white; border: none; }
        .btn-clear:hover { background-color: #8e0000; }

        .btn-download { background-color: #4CAF50; color: white; border: none; }
        .btn-download:hover { background-color: #43A047; }

        @media (max-width: 600px) {
            .btn-action { min-width: 90px; font-size: 14px; height: 48px; }
            .btn-square { width: 48px; height: 48px; font-size: 26px; }
            #notepad { font-size: 18px; padding: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📝 IM NotePad</h2>
        <div class="controls">
            <button id="fontIncrease" class="btn-square" title="글자 확대">+</button>
            <button id="fontDecrease" class="btn-square" title="글자 축소">−</button>

            <button id="clearBtn" class="btn-action btn-clear" title="전체 삭제">전체삭제</button>
            <button id="downloadBtn" class="btn-action btn-download" title="txt로 저장">저장하기</button>
        </div>
    </div>

    <div class="editor-wrapper">
        <div id="notepad" contenteditable="true" spellcheck="false"></div>
    </div>

    <div class="footer">
        <div><span id="charCount">0</span> 자</div>
    </div>
</div>

<script>
(function () {
    'use strict';

    const STORAGE_KEY = 'savedMemo';
    const FONT_KEY = 'notepadFontSize';
    const DEFAULT_FONT = 20;
    const MIN_FONT = 12;
    const MAX_FONT = 40;

    const notepad      = document.getElementById('notepad');
    const charCount    = document.getElementById('charCount');
    const downloadBtn  = document.getElementById('downloadBtn');
    const clearBtn     = document.getElementById('clearBtn');
    const fontIncrease = document.getElementById('fontIncrease');
    const fontDecrease = document.getElementById('fontDecrease');

    let currentFontSize = DEFAULT_FONT;
    let saveTimer = null;

    /* ---------- 초기화 ---------- */
    function init() {
        const savedText = localStorage.getItem(STORAGE_KEY) || '';
        if (savedText) {
            notepad.innerText = savedText;
        }

        const savedFont = parseInt(localStorage.getItem(FONT_KEY), 10);
        if (!isNaN(savedFont) && savedFont >= MIN_FONT && savedFont <= MAX_FONT) {
            currentFontSize = savedFont;
        }
        notepad.style.fontSize = currentFontSize + 'px';

        updateCharCount();
        updatePlaceholder();
    }

    /* ---------- 저장 (디바운스) ---------- */
    function scheduleSave() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
            try {
                localStorage.setItem(STORAGE_KEY, notepad.innerText);
            } catch (e) {
                console.warn('저장 실패:', e);
            }
        }, 250);
    }

    /* ---------- 글자수 / placeholder ---------- */
    function updateCharCount() {
        const text = notepad.innerText.replace(/\n$/, '');
        charCount.textContent = text.length;
    }

    function updatePlaceholder() {
        const isEmpty =
            notepad.innerHTML.trim() === '' ||
            notepad.innerHTML === '<br>' ||
            notepad.innerText.trim() === '';
        notepad.classList.toggle('is-empty', isEmpty);
    }

    /* ---------- 입력 이벤트 ---------- */
    notepad.addEventListener('input', () => {
        updateCharCount();
        updatePlaceholder();
        scheduleSave();
    });

    /* ---------- ★ 붙여넣기: 순수 텍스트만 삽입 (서식/배경 제거) ★ ---------- */
    notepad.addEventListener('paste', (e) => {
        e.preventDefault();

        // 클립보드에서 순수 텍스트만 꺼내옴 (HTML/서식 완전 배제)
        const raw = (e.clipboardData || window.clipboardData).getData('text/plain');
        if (!raw) return;

        // 줄바꿈 정규화 (CRLF, CR → LF)
        const text = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

        const sel = window.getSelection();
        if (!sel || !sel.rangeCount) return;

        const range = sel.getRangeAt(0);
        range.deleteContents();

        // '\n' 을 <br> 로 변환해 조각으로 삽입
        const lines = text.split('\n');
        const frag = document.createDocumentFragment();
        lines.forEach((line, idx) => {
            if (idx > 0) frag.appendChild(document.createElement('br'));
            if (line.length > 0) frag.appendChild(document.createTextNode(line));
        });

        const lastNode = frag.lastChild;
        range.insertNode(frag);

        // 커서를 삽입한 텍스트 끝으로 이동
        if (lastNode) {
            const newRange = document.createRange();
            newRange.setStartAfter(lastNode);
            newRange.collapse(true);
            sel.removeAllRanges();
            sel.addRange(newRange);
        }

        // 저장 및 카운트 갱신
        updateCharCount();
        updatePlaceholder();
        scheduleSave();
    });

    /* ---------- 폰트 크기 ---------- */
    function applyFontSize() {
        notepad.style.fontSize = currentFontSize + 'px';
        localStorage.setItem(FONT_KEY, currentFontSize);
    }

    fontIncrease.addEventListener('click', () => {
        if (currentFontSize < MAX_FONT) {
            currentFontSize = Math.min(currentFontSize + 2, MAX_FONT);
            applyFontSize();
        }
    });

    fontDecrease.addEventListener('click', () => {
        if (currentFontSize > MIN_FONT) {
            currentFontSize = Math.max(currentFontSize - 2, MIN_FONT);
            applyFontSize();
        }
    });

    /* ---------- 저장하기 (txt 다운로드) ---------- */
    downloadBtn.addEventListener('click', () => {
        const textData = notepad.innerText;
        if (!textData.trim()) {
            alert('다운로드할 내용이 없습니다!');
            return;
        }

        const blob = new Blob([textData], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;

        const now = new Date();
        const ts =
            now.getFullYear() +
            String(now.getMonth() + 1).padStart(2, '0') +
            String(now.getDate()).padStart(2, '0') + '_' +
            String(now.getHours()).padStart(2, '0') +
            String(now.getMinutes()).padStart(2, '0');

        link.download = `notepad_${ts}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    });

    /* ---------- 전체삭제 (확인창 없이 바로 실행) ---------- */
    clearBtn.addEventListener('click', () => {
        notepad.innerHTML = '';
        localStorage.removeItem(STORAGE_KEY);
        updateCharCount();
        updatePlaceholder();
    });

    /* ---------- 시작 ---------- */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>

</body>
</html>
