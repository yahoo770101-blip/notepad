<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 스마트 포토 메모장</title>
    <!-- 글과 사진 전체를 통째로 선명하게 찍어주는 공인 라이브러리 -->
    <script src="https://hertzen.com"></script>
    <style>
        /* 테마를 삭제하고 완전히 고정된 딥 블랙 스타일을 적용했습니다 */
        :root {
            --bg-color: #121212; /* 더 깊고 어두운 블랙 */
            --text-color: #ffffff; /* 순백색 글자 */
            --pad-bg: #1e1e1e; /* 입력창 배경 */
            --border-color: #333333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        /* 캡처할 때 테두리가 잘리지 않도록 감싸는 특수 영역 패딩 주입 */
        .editor-wrapper {
            background-color: var(--bg-color);
            padding: 5px;
            border-radius: 8px;
        }
        /* 입력창 스타일 */
        #notepad {
            width: 100%;
            height: 65vh;
            background-color: var(--pad-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            font-size: 20px; /* 1. 시작 글자 크기를 20px로 설정했습니다 */
            line-height: 1.7;
            box-sizing: border-box;
            border-radius: 8px;
            overflow-y: auto;
            word-break: break-all;
        }
        #notepad:focus {
            outline: 2px solid #2196F3;
        }
        #notepad img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 15px 0;
            border-radius: 6px;
        }
        
        /* 안내 가이드 문구 */
        #notepad:empty:before {
            content: "여기에 내용을 입력하거나 사진을 추가하세요. 자동으로 저장됩니다...";
            color: #666;
            cursor: text;
        }

        .footer {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
        
        /* ---------------- 버튼 디자인 설정 ---------------- */
        button {
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #444;
            background: var(--pad-bg);
            color: var(--text-color);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            height: 55px;
            transition: background 0.2s;
        }
        button:hover {
            background: #2a2a2a;
        }
        
        /* 2. 글자 확대/축소 버튼 크기를 36px 거대 규격으로 지정했습니다 */
        .btn-square {
            width: 55px;
            font-size: 36px; 
            padding-bottom: 4px; /* 기호 정중앙 정렬 보정 */
        }
        
        /* 3. 일반 기능 버튼 군 디자인 고정 */
        .btn-action {
            width: 130px;
            font-size: 18px;
        }
        
        /* 기능별 포인트 컬러 */
        .btn-img { background-color: #2196F3; color: white; border: none; }
        .btn-download { background-color: #4CAF50; color: white; border: none; }
        
        #imageInput { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📝 Photo Memo</h2>
        <div class="controls">
            <!-- 테마 버튼을 완벽히 도려내고, 거대화된 +와 - 버튼만 단정하게 배치했습니다 -->
            <button id="fontIncrease" class="btn-square" title="글자 확대">+</button>
            <button id="fontDecrease" class="btn-square" title="글자 축소">-</button>
            
            <button id="imgBtn" class="btn-action btn-img" onclick="document.getElementById('imageInput').click()">이미지 첨부</button>
            <input type="file" id="imageInput" accept="image/*">
            
            <button id="downloadBtn" class="btn-action btn-download">저장하기</button>
        </div>
    </div>
    
    <div class="editor-wrapper" id="captureArea">
        <div id="notepad" contenteditable="true"></div>
    </div>
    
    <div class="footer">
        <div>* 사진 클릭 후 키보드 Delete를 누르면 삭제됩니다.</div>
        <div><span id="charCount">0</span> 자</div>
    </div>
</div>

<script>
    var notepad = document.getElementById('notepad');
    var charCount = document.getElementById('charCount');
    var downloadBtn = document.getElementById('downloadBtn');
    var fontIncrease = document.getElementById('fontIncrease');
    var fontDecrease = document.getElementById('fontDecrease');
    var imageInput = document.getElementById('imageInput');

    var currentFontSize = 20; // 기본 시작 값을 20으로 맞춤

    window.onload = function() {
        notepad.innerHTML = localStorage.getItem('savedPhotoMemo') || '';
        
        var savedFontSize = localStorage.getItem('notepadFontSize');
        if (savedFontSize) {
            currentFontSize = parseInt(savedFontSize);
        }
        notepad.style.fontSize = currentFontSize + 'px';
        
        updateCharCount();
        updateImgSize();
    };

    notepad.addEventListener('input', function() {
        localStorage.setItem('savedPhotoMemo', notepad.innerHTML);
        updateCharCount();
    });

    function updateCharCount() {
        charCount.innerText = notepad.innerText.replace(/\n/g, '').length;
    }

    function updateImgSize() {
        var imgs = notepad.getElementsByTagName('img');
        for (var i = 0; i < imgs.length; i++) {
            imgs[i].style.maxWidth = Math.min(100, (currentFontSize * 4)) + '%';
        }
    }

    fontIncrease.addEventListener('click', function() {
        if (currentFontSize < 60) {
            currentFontSize += 2;
            notepad.style.fontSize = currentFontSize + 'px';
            localStorage.setItem('notepadFontSize', currentFontSize);
            updateImgSize();
        }
    });

    fontDecrease.addEventListener('click', function() {
        if (currentFontSize > 12) {
            currentFontSize -= 2;
            notepad.style.fontSize = currentFontSize + 'px';
            localStorage.setItem('notepadFontSize', currentFontSize);
            updateImgSize();
        }
    });

    imageInput.addEventListener('change', function(e) {
        if (!e.target.files || e.target.files.length === 0) return;
        var file = e.target.files;

        var reader = new FileReader();
        reader.onload = function(event) {
            var newImg = document.createElement('img');
            newImg.src = event.target.result;
            
            notepad.focus();
            notepad.appendChild(newImg);
            notepad.appendChild(document.createElement('br'));
            
            localStorage.setItem('savedPhotoMemo', notepad.innerHTML);
            updateCharCount();
            updateImgSize();
        };
        reader.readAsDataURL(file);
        imageInput.value = ''; 
    });

    // 💾 [대혁신 수리] 긴 글과 사진이 잘리지 않고 끝까지 찍히는 완전체 스냅샷 다운로드 장치
    downloadBtn.addEventListener('click', function() {
        if (!notepad.innerText.trim() && notepad.getElementsByTagName('img').length === 0) {
            alert('내용이 없습니다!');
            return;
        }

        if (typeof html2canvas === 'undefined') {
            alert('모듈을 불러오는 중입니다. 잠시 후 다시 시도해 주세요!');
            return;
        }

        // [핵심] 보이지 않는 아래 영역까지 전부 확장하여 캡처하도록 계산하는 특수 옵션 주입
        html2canvas(notepad, {
            backgroundColor: '#1e1e1e', // 칠해질 내부 블랙 색상 고정
            useCORS: true,
            scale: 2, // 초선명 화질 강화 유지
            height: notepad.scrollHeight, // 화면 높이가 아닌, 보이지 않는 아래 글끝까지 높이 강제 추적
            windowHeight: notepad.scrollHeight
        }).then(function(canvas) {
            canvas.toBlob(function(blob) {
                var now = new Date();
                var timestamp = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0') + '_' + String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');
                
                var link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'my_complete_memo_' + timestamp + '.jpg';
                link.click();
                URL.revokeObjectURL(link.href);
            }, 'image/jpeg', 0.95);
        }).catch(function(err) {
            alert("이미지 변환 중 오류가 발생했습니다.");
        });
    });
</script>

</body>
</html>
