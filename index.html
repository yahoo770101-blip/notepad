<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 스마트 메모장</title>
    <style>
        /* 기본 상태: 다크 모드 */
        :root {
            --bg-color: #1e1e1e;
            --text-color: #f5f5f5;
            --pad-bg: #2d2d2d;
        }
        /* 라이트 모드 */
        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #333333;
            --pad-bg: #f9f9f9;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            transition: all 0.3s;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        textarea {
            width: 100%;
            height: 70vh;
            background-color: var(--pad-bg);
            color: var(--text-color);
            border: 1px solid #444;
            padding: 15px;
            font-size: 18px; /* 기본 글자 크기 */
            line-height: 1.6;
            resize: none;
            box-sizing: border-box;
            border-radius: 8px;
        }
        .footer {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
        }
        
        /* 모든 상단 버튼 공통 스타일 (기존보다 1.5배 확대) */
        button {
            padding: 12px 24px; /* 버튼 상하좌우 여백을 넓혀 크기를 키웠습니다 */
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #555;
            background: var(--pad-bg);
            color: var(--text-color);
            font-weight: bold;
            font-size: 24px; /* 글자 크기를 기존 16px에서 24px로 1.5배 키웠습니다 */
            transition: background 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        
        /* 저장 버튼만 글자 크기를 약간 조절하여 균형을 맞췄습니다 */
        .btn-download {
            background-color: #4CAF50;
            color: white;
            border: none;
            font-size: 20px;
            padding: 15px 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📝 My Notepad</h2>
        <div class="controls">
            <!-- 요청하신 대로 + 버튼을 왼쪽, - 버튼을 오른쪽에 배치했습니다 -->
            <button id="fontIncrease" title="글자 확대">+</button>
            <button id="fontDecrease" title="글자 축소">-</button>
            <button id="themeToggle" title="테마 전환">🌓</button> <!-- 텍스트 대신 직관적인 아이콘으로 변경 -->
            <button id="downloadBtn" class="btn-download">💾 저장</button>
        </div>
    </div>
    
    <textarea id="notepad" placeholder="여기에 내용을 입력하면 자동으로 저장됩니다..."></textarea>
    
    <div class="footer">
        <span id="charCount">0</span> 자
    </div>
</div>

<script>
    const notepad = document.getElementById('notepad');
    const charCount = document.getElementById('charCount');
    const themeToggle = document.getElementById('themeToggle');
    const downloadBtn = document.getElementById('downloadBtn');
    const fontIncrease = document.getElementById('fontIncrease');
    const fontDecrease = document.getElementById('fontDecrease');

    let currentFontSize = 18;

    window.onload = () => {
        notepad.value = localStorage.getItem('savedMemo') || '';
        updateCharCount();
        
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);

        const savedFontSize = localStorage.getItem('notepadFontSize');
        if (savedFontSize) {
            currentFontSize = parseInt(savedFontSize);
            notepad.style.fontSize = currentFontSize + 'px';
        } else {
            notepad.style.fontSize = currentFontSize + 'px';
        }
    };

    notepad.addEventListener('input', () => {
        localStorage.setItem('savedMemo', notepad.value);
        updateCharCount();
    });

    function updateCharCount() {
        charCount.innerText = notepad.value.length;
    }

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });

    fontIncrease.addEventListener('click', () => {
        if (currentFontSize < 60) { // 눈이 편하시도록 최대 크기를 60px까지 확장했습니다
            currentFontSize += 2;
            notepad.style.fontSize = currentFontSize + 'px';
            localStorage.setItem('notepadFontSize', currentFontSize);
        }
    });

    fontDecrease.addEventListener('click', () => {
        if (currentFontSize > 12) {
            currentFontSize -= 2;
            notepad.style.fontSize = currentFontSize + 'px';
            localStorage.setItem('notepadFontSize', currentFontSize);
        }
    });

    downloadBtn.addEventListener('click', () => {
        const textData = notepad.value;
        if (!textData.trim()) {
            alert('다운로드할 내용이 없습니다!');
            return;
        }

        const blob = new Blob([textData], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        
        const now = new Date();
        const timestamp = now.getFullYear() + 
                         String(now.getMonth() + 1).padStart(2, '0') + 
                         String(now.getDate()).padStart(2, '0') + '_' + 
                         String(now.getHours()).padStart(2, '0') + 
                         String(now.getMinutes()).padStart(2, '0');
        
        link.download = `notepad_${timestamp}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);
    });
</script>

</body>
</html>
